<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro's Pickleball Club – Open Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#0a2358;--mut:#5b6b8c;--line:#d9e2f1;--blue:#0b8fe0;--red:#e8141c;--pri:#0a2358;--on:#fff;--soft:#eaf1fb;--ok:#13875b;--ld:block;--dd:none;
--disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#121c38;--ink:#eaf0ff;--mut:#93a3c7;--line:#243255;--blue:#2da2f0;--red:#ff5a60;--pri:#2d7fff;--soft:#1a2750;--ok:#3ccf91;--ld:none;--dd:block}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#121c38;--ink:#eaf0ff;--mut:#93a3c7;--line:#243255;--blue:#2da2f0;--red:#ff5a60;--pri:#2d7fff;--soft:#1a2750;--ok:#3ccf91;--ld:none;--dd:block}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--body)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:3px solid var(--blue);box-shadow:0 3px 0 var(--red)}
.hd{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;flex:none}
.logo img{height:52px;width:auto}
.logo .l{display:var(--ld)}
.logo .d{display:var(--dd)}
.hd h1{margin:0;font:italic 800 clamp(20px,3.6vw,32px)/1.05 var(--disp);letter-spacing:.5px;flex:1;min-width:0}
.hd h1 small{display:block;font:600 12px var(--body);font-style:normal;color:var(--mut);letter-spacing:.3px;margin-top:3px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-weight:600}
button:hover{border-color:var(--pri)}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}
button.dng{color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
nav{max-width:1500px;margin:0 auto;padding:12px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
nav button{border-radius:999px}
nav button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
main{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar .sp{flex:1}
.addrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.addrow input{flex:1;min-width:200px}
.lay{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:920px){.lay{grid-template-columns:1fr 320px;align-items:start}.lay aside{position:sticky;top:calc(96px + env(safe-area-inset-top,0px))}}
@media(min-width:1400px){body{font-size:16px}.lay{grid-template-columns:1fr 360px}}
@media(max-width:640px){.hd{padding:8px 12px;gap:10px}.logo img{height:40px}.hd h1 small{display:none}main{padding:12px 12px 60px}nav{padding:10px 12px 0;flex-wrap:nowrap;overflow-x:auto}nav button{flex:1;white-space:nowrap}button,select,input{min-height:42px}.bar button{flex:1}.acts button{flex:1}.pl .row{display:grid;grid-template-columns:1fr auto}.pl .row input[type=text]{grid-column:1/-1}th,td{padding:8px 5px;font-size:14px}.ch{flex-wrap:wrap}}
@media(max-width:420px){.hd h1{font-size:18px}.th-t{display:none}#theme{padding:8px 10px}}
.courts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.ch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ch .nm{font:italic 800 22px var(--disp);background:transparent;border:1.5px solid transparent;padding:2px 6px;flex:1;width:100%}
.ch .nm:hover,.ch .nm:focus{border-color:var(--line)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 10px;background:transparent}
.seg button.on{background:var(--pri);color:var(--on)}
.team{border-radius:10px;padding:8px;margin-bottom:6px;display:grid;gap:6px}
.team.a{background:color-mix(in srgb,var(--blue) 14%,transparent);border-left:5px solid var(--blue)}
.team.b{background:color-mix(in srgb,var(--red) 12%,transparent);border-left:5px solid var(--red)}
.team b{font:italic 800 15px var(--disp);letter-spacing:.5px}
.team select{width:100%}
.vs{text-align:center;font:italic 800 14px var(--disp);color:var(--mut);margin:2px 0}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0 8px}
.score input{width:100%;text-align:center;font:800 22px var(--disp);padding:6px}
.score span{font-weight:700;color:var(--mut)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .pri{flex:1}
h2{font:italic 800 22px var(--disp);margin:0 0 8px}
.q{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.q li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.q li.next{outline:2px solid var(--blue)}
.q .n{font:italic 800 18px var(--disp);width:22px;color:var(--mut)}
.q .p{flex:1;font-weight:600}
.q .g{font-size:13px;color:var(--mut);white-space:nowrap}
.tag{font:700 11px var(--body);background:var(--blue);color:#fff;border-radius:6px;padding:2px 6px}
.mut{color:var(--mut)}
.empty{padding:22px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:13px;color:var(--mut);font-weight:700}
td.r{font:italic 800 20px var(--disp);width:44px;text-align:center}
tr.top td{background:var(--soft)}
.wrap{overflow-x:auto}
.pl{display:grid;gap:8px}
.pl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl .row input[type=text]{flex:1;min-width:140px}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bk textarea{width:100%;min-height:90px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:inherit}
.note{font-size:13px;color:var(--mut);margin:6px 0}
.warn{background:color-mix(in srgb,var(--red) 14%,transparent);border:1.5px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.pl label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--on);padding:11px 18px;border-radius:12px;font-weight:700;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

(function(){

function idb(op,val){return new Promise(function(res){try{var r=indexedDB.open('maestro',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onerror=function(){res(null)};r.onsuccess=function(){var db=r.result,tx=db.transaction('kv',op==='get'?'readonly':'readwrite'),st=tx.objectStore('kv'),q=op==='get'?st.get('state'):st.put(val,'state');q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)};tx.oncomplete=function(){db.close()}}}catch(e){res(null)}})}

var persisted=false;

function need(c){return c.type==='singles'?2:4}
function occupied(){var o={};S.courts.forEach(function(c){c.slots.forEach(function(x){if(x)o[x]=1})});return o}
function queue(){var o=occupied();return S.players.filter(function(p){return p.present&&!o[p.id]}).sort(function(x,y){return x.sg-y.sg||x.last-y.last||x.j-y.j})}
function games(n){return n+(n===1?' game':' games')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('show')},2800)}
function applyTheme(){
  var r=document.documentElement;
  if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
  var dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('theme').innerHTML=dark?'☀<span class="th-t"> Default mode</span>':'🌙<span class="th-t"> Dark mode</span>';
}
function addPlayers(txt){
  var names=txt.split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean),n=0;
  names.forEach(function(nm){S.players.push({id:uid(),name:nm,present:true,played:0,wins:0,losses:0,sg:0,last:0,j:Math.random()});n++});
  return n;
}
function fill(c){
  var n=need(c),q=queue(),empty=[];
  for(var i=0;i<n;i++)if(!c.slots[i])empty.push(i);
  var picks=q.slice(0,empty.length);
  if(empty.length===n){for(var i=picks.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1));var t=picks[i];picks[i]=picks[k];picks[k]=t}}
  picks.forEach(function(p,i){c.slots[empty[i]]=p.id});
  if(picks.length<empty.length)toast('Not enough players waiting for '+c.name);
}
function render(){
  var tabs=[['play','Open Play'],['players','Players'],['rank','Ranking']];
  document.getElementById('tabs').innerHTML=tabs.map(function(t){return '<button data-act="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  var a=document.getElementById('app');
  a.innerHTML=S.tab==='play'?vPlay():S.tab==='players'?vPlayers():vRank();
  applyTheme();save();
}
function addForm(){return '<div class="addrow"><input id="newp" type="text" placeholder="Player name (add several with commas)" aria-label="New player name"><button class="pri" data-act="addp">Save player</button></div>'}
function warn(){return UI.noStore?'<div class="warn"><b>Saving is blocked in this browser.</b> Players and results will be lost when you close this tab. Turn off private browsing, or use Export backup often.</div>':''}
function vPlay(){
  var q=queue();
  var h=warn()+'<div class="bar"><button data-act="addc">+ Add Court</button><button data-act="toggleadd">+ Add Player</button><span class="sp"></span><button data-act="newsess" class="'+(UI.armed==='sess'?'dng':'')+'" title="Starts a fresh session: clears games and rankings, keeps saved players.">'+(UI.armed==='sess'?'Tap again: clear rankings':'New Session')+'</button></div>';
  if(UI.adding)h+=addForm();
  h+='<div class="lay"><div class="courts">';
  S.courts.forEach(function(c){h+=vCourt(c,q)});
  h+='</div><aside class="card"><h2>Waiting Queue</h2>';
  if(!S.players.length)h+='<div class="empty">No players yet. Add players to start the rotation.</div>';
  else if(!q.length)h+='<div class="empty">Nobody is waiting.</div>';
  else{h+='<ol class="q">';q.forEach(function(p,i){h+='<li class="'+(i<4?'next':'')+'"><span class="n">'+(i+1)+'</span><span class="p">'+esc(p.name)+'</span><span class="g">'+games(p.sg)+'</span></li>'});h+='</ol><p class="mut" style="font-size:13px;margin:10px 0 0">Fewest games first. Ties rotate to whoever has waited longest, then randomly. Outlined players are next up.</p>'}
  return h+'</aside></div>';
}
function vCourt(c,q){
  var n=need(c),h='<section class="card" data-c="'+c.id+'"><div class="ch"><input class="nm" data-act="rename" value="'+esc(c.name)+'" aria-label="Court name">';
  h+='<div class="seg" role="group" aria-label="Match type"><button data-act="type" data-v="singles" class="'+(c.type==='singles'?'on':'')+'">Singles</button><button data-act="type" data-v="doubles" class="'+(c.type==='doubles'?'on':'')+'">Doubles</button></div></div>';
  function sel(i){
    var cur=c.slots[i]?P(c.slots[i]):null,o='<option value="">Select player</option>';
    if(cur)o+='<option value="'+cur.id+'" selected>'+esc(cur.name)+' ('+cur.sg+')</option>';
    q.forEach(function(p){o+='<option value="'+p.id+'">'+esc(p.name)+' ('+p.sg+')</option>'});
    return '<select data-act="slot" data-i="'+i+'" aria-label="Player '+(i+1)+'">'+o+'</select>';
  }
  var half=n/2,ta='',tb='';
  for(var i=0;i<half;i++){ta+=sel(i);tb+=sel(i+half)}
  h+='<div class="team a"><b>Team A</b>'+ta+'</div><div class="vs">vs.</div><div class="team b"><b>Team B</b>'+tb+'</div>';
  var full=true;for(var i=0;i<n;i++)if(!c.slots[i])full=false;
  h+='<div class="score"><input type="number" min="0" inputmode="numeric" placeholder="A" data-act="sa" value="'+esc(c.a)+'" aria-label="Team A score"><span>–</span><input type="number" min="0" inputmode="numeric" placeholder="B" data-act="sb" value="'+esc(c.b)+'" aria-label="Team B score"></div>';
  h+='<div class="acts"><button class="pri" data-act="finish"'+(full?'':' disabled')+'>Finish Match</button><button data-act="auto">Auto-fill</button><button data-act="clear">Clear</button><button class="dng" data-act="delc">'+(UI.armed==='c'+c.id?'Sure?':'Remove')+'</button></div></section>';
  return h;
}
function vPlayers(){
  var h=warn()+'<div class="card"><h2>Saved Players</h2>'+addForm();
  if(!S.players.length)h+='<div class="empty">No saved players yet. Add names above and they stay saved on this device for future Open Play sessions.</div>';
  else{h+='<div class="pl">';
  S.players.forEach(function(p){h+='<div class="row" data-p="'+p.id+'"><input type="text" data-act="pname" value="'+esc(p.name)+'" aria-label="Player name"><label><input type="checkbox" data-act="pres"'+(p.present?' checked':'')+'> Here today</label><button class="dng" data-act="delp">'+(UI.armed==='p'+p.id?'Sure?':'Remove')+'</button></div>'});
  h+='</div>'}
  h+='</div>'+vBackup();
  return h;
}
function vBackup(){
  var h='<div class="card" style="margin-top:14px"><h2>Backup</h2><p class="note">Players, rankings and courts save automatically on this device and stay after you refresh or close the browser. Export a backup file to keep a copy or move to another device.</p><div class="bk"><button class="pri" data-act="export">Export backup</button><button data-act="impbtn">Import backup file</button><input id="impfile" data-act="impfile" type="file" accept=".json,application/json" hidden></div>';
  if(UI.exportText)h+='<p class="note">Copy this text and save it somewhere safe. To restore, paste it below.</p><textarea id="exp" readonly aria-label="Backup text">'+esc(UI.exportText)+'</textarea><div class="bk"><button data-act="copyexp">Copy text</button><button data-act="hideexp">Close</button></div>';
  h+='<details><summary class="note" style="cursor:pointer">Restore from pasted text</summary><div class="bk"><textarea id="imptext" aria-label="Paste backup text" placeholder="Paste backup text here"></textarea><button data-act="imptxt">Read backup</button></div></details>';
  if(UI.pending)h+='<div class="warn">Backup found: <b>'+UI.pending.players.length+' players</b>, '+UI.pending.courts.length+' courts. Importing replaces the data on this device.<div class="bk"><button class="pri" data-act="impok">Replace my data</button><button data-act="impno">Cancel</button></div></div>';
  return h+'</div>';
}
function parseBackup(txt){
  try{var d=JSON.parse(txt);d=d&&d.data?d.data:d;if(!d||!Array.isArray(d.players))return null;
    var num=function(v){v=+v;return isFinite(v)&&v>=0?Math.floor(v):0};
    var pl=d.players.filter(function(p){return p&&typeof p.name==='string'&&p.name.trim()}).map(function(p){return{id:String(p.id||uid()),name:p.name.trim(),present:p.present!==false,played:num(p.played),wins:num(p.wins),losses:num(p.losses),sg:num(p.sg),last:num(p.last),j:Math.random()}});
    var cs=(Array.isArray(d.courts)?d.courts:[]).filter(function(c){return c&&typeof c.name==='string'}).map(function(c){var t=c.type==='singles'?'singles':'doubles';return{id:String(c.id||uid()),name:c.name,type:t,slots:[null,null,null,null],a:'',b:''}});
    if(!cs.length)cs=[mkCourt('Court 1'),mkCourt('Court 2')];
    return{players:pl,courts:cs,seq:num(d.seq),theme:d.theme==='dark'||d.theme==='light'?d.theme:null};
  }catch(e){return null}
}
function stamp(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function doExport(){
  var json=JSON.stringify({app:'maestro-openplay',version:1,exported:new Date().toISOString(),data:{players:S.players,courts:S.courts,seq:S.seq,theme:S.theme}},null,2);
  var go=function(dl){
    if(dl){return dl.save({filename:'maestro-backup-'+stamp()+'.json',data:json}).then(function(){toast('Backup saved')},function(e){if(e&&e.code==='declined')return;UI.exportText=json;render()})}
    UI.exportText=json;render();toast('Copy the backup text and keep it safe');
  };
  try{if(window.claude&&window.claude.use){window.claude.use('downloads').then(go,function(){go(null)});return}}catch(e){}
  try{var bl=new Blob([json],{type:'application/json'}),u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='maestro-backup-'+stamp()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Backup downloaded');return}catch(e){}
  go(null);
}
function vRank(){
  var r=S.players.filter(function(p){return p.played>0}).sort(function(x,y){return rate(y)-rate(x)||y.wins-x.wins||y.played-x.played||x.name.localeCompare(y.name)});
  var h='<div class="card"><h2>Overall Ranking</h2>';
  h+='<div class="wrap"><table><thead><tr><th>Rank</th><th>Player</th><th>Played</th><th>Wins</th><th>Losses</th><th>Win Rate</th></tr></thead><tbody>';
  r.forEach(function(p,i){h+='<tr class="'+(i<3&&p.played?'top':'')+'"><td class="r">'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.played+'</td><td>'+p.wins+'</td><td>'+p.losses+'</td><td><b>'+Math.round(rate(p))+'%</b></td></tr>'});
  return h+'</tbody></table></div><p class="mut" style="font-size:13px">Win Rate = Wins ÷ Played × 100</p></div>';
}
function rate(p){return p.played?p.wins/p.played*100:0}
function court(el){var s=el.closest('[data-c]');return s&&S.courts.find(function(c){return c.id===s.dataset.c})}
function disarm(keep){if(UI.armed&&UI.armed!==keep)UI.armed=null}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  var act=b.dataset.act,c=court(b),p=null,pr=b.closest('[data-p]');if(pr)p=P(pr.dataset.p);
  if(act==='theme'){var dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';render();return}
  if(act==='export'){doExport();return}
  if(act==='impbtn'){document.getElementById('impfile').click();return}
  if(act==='copyexp'){var ta=document.getElementById('exp');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copied')},function(){document.execCommand('copy');toast('Copied')})}catch(x){try{document.execCommand('copy');toast('Copied')}catch(y){}}return}
  if(act==='hideexp'){UI.exportText=''}
  else if(act==='imptxt'){var d=parseBackup(document.getElementById('imptext').value);if(!d){toast('That text is not a valid Maestro backup');return}UI.pending=d}
  else if(act==='impno'){UI.pending=null}
  else if(act==='impok'){var d=UI.pending;S.players=d.players;S.courts=d.courts;S.seq=d.seq;if(d.theme)S.theme=d.theme;UI.pending=null;toast('Backup imported: '+S.players.length+' players')}
  else if(act==='tab'){S.tab=b.dataset.v;UI.armed=null}
  else if(act==='toggleadd'){UI.adding=!UI.adding;render();var i=document.getElementById('newp');if(i)i.focus();return}
  else if(act==='addp'){var i=document.getElementById('newp'),n=addPlayers(i.value);if(n)toast(n+(n===1?' player saved':' players saved'));UI.adding=false;if(!n){return}}
  else if(act==='addc'){S.courts.push(mkCourt('Court '+(S.courts.length+1)))}
  else if(act==='type'){c.type=b.dataset.v;var n=need(c);while(c.slots.length<4)c.slots.push(null);for(var i=n;i<4;i++)c.slots[i]=null;if(n===2&&false){}}
  else if(act==='auto'){fill(c)}
  else if(act==='clear'){c.slots=[null,null,null,null];c.a='';c.b=''}
  else if(act==='delc'){if(UI.armed==='c'+c.id){S.courts=S.courts.filter(function(x){return x!==c});UI.armed=null}else{UI.armed='c'+c.id;render();return}}
  else if(act==='delp'){if(UI.armed==='p'+p.id){S.players=S.players.filter(function(x){return x!==p});S.courts.forEach(function(k){k.slots=k.slots.map(function(x){return x===p.id?null:x})});UI.armed=null}else{UI.armed='p'+p.id;render();return}}
  else if(act==='newsess'){if(UI.armed==='sess'){S.players.forEach(function(x){x.sg=0;x.last=0;x.played=0;x.wins=0;x.losses=0;x.j=Math.random()});S.seq=0;S.courts.forEach(function(k){k.slots=[null,null,null,null];k.a='';k.b=''});UI.armed=null;UI.adding=false;S.tab='play';toast('New session started. Rankings cleared, players kept.')}else{UI.armed='sess';render();return}}
  else if(act==='finish'){
    var n=need(c),a=parseInt(c.a,10),bb=parseInt(c.b,10);
    if(isNaN(a)||isNaN(bb)||a<0||bb<0){toast('Enter both scores to finish the match');return}
    if(a===bb){toast('Scores are tied. Enter the final score with a winner.');return}
    var half=n/2,aWin=a>bb;
    for(var i=0;i<n;i++){var pl=P(c.slots[i]);if(!pl)continue;var inA=i<half,won=inA===aWin;pl.played++;pl.sg++;pl.last=++S.seq;if(won)pl.wins++;else pl.losses++}
    toast(c.name+': Team '+(aWin?'A':'B')+' won '+Math.max(a,bb)+' – '+Math.min(a,bb));
    c.slots=[null,null,null,null];c.a='';c.b='';
  }
  disarm();render();
});
document.addEventListener('change',function(e){
  var t=e.target,act=t.dataset.act;if(!act)return;
  var c=court(t),pr=t.closest('[data-p]'),p=pr&&P(pr.dataset.p);
  if(act==='impfile'){var f=t.files&&t.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var d=parseBackup(fr.result);if(!d){toast('That file is not a valid Maestro backup');return}UI.pending=d;S.tab='players';render()};fr.readAsText(f);t.value='';return}
  if(act==='rename'){c.name=t.value.trim()||c.name;render()}
  else if(act==='slot'){c.slots[+t.dataset.i]=t.value||null;render()}
  else if(act==='pname'){p.name=t.value.trim()||p.name;render()}
  else if(act==='pres'){p.present=t.checked;render()}
});
document.addEventListener('input',function(e){
  var t=e.target,act=t.dataset.act;
  if(act==='sa'||act==='sb'){var c=court(t);if(c)c[act==='sa'?'a':'b']=t.value;save()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newp'){var n=addPlayers(e.target.value);if(n){toast(n+(n===1?' player saved':' players saved'));UI.adding=false;render()}}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!S.theme)applyTheme()})}catch(e){}
if(hadLS){ready=true;render()}
else{render();idb('get').then(function(j){try{var d=j&&JSON.parse(j);if(d&&d.players&&d.players.length){S=Object.assign(S,d);if(!S.courts||!S.courts.length)S.courts=[mkCourt('Court 1'),mkCourt('Court 2')]}}catch(e){}ready=true;render()})}
})();
</script>
</body>
</html>
